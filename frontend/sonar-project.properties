# SonarQube properties for the frontend (run scanner from the `frontend/` folder)
sonar.projectKey=TimeCircle-Frontend
sonar.projectName=TimeCircle Frontend
sonar.projectVersion=1.0

# Sources and test files
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.js,**/*.spec.js

sonar.sourceEncoding=UTF-8

# LCOV coverage generated by Jest/Vitest (common path: coverage/lcov.info)
# Example (Jest): `npx jest --coverage` -> coverage/lcov.info
# Example (Vitest): ensure lcov reporter + vitest-junit for junit xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Generic test execution report (JUnit XML). Many runners can output junit xml
# Example vitest-junit or jest-junit -> coverage/junit.xml
sonar.testExecutionReportPaths=coverage/junit.xml

# Exclude dependencies and build outputs
sonar.exclusions=node_modules/**,dist/**,build/**

# Files to omit from coverage metrics
sonar.coverage.exclusions=
