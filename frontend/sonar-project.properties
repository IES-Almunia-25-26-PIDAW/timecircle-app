sonar.projectKey=timecircle-frontend
sonar.projectName=TimeCircle Frontend
sonar.projectVersion=1.15
sonar.sourceEncoding=UTF-8

# React / Vite
sonar.sources=src/app
sonar.tests=src/__tests__
sonar.test.inclusions=\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/**/*.spec.ts,\
  src/**/*.spec.tsx,\
  src/**/__tests__/**

# Coverage report generated from frontend/ when frontend tests are added.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep dependencies, builds, and generated reports out of the analysis.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/**/*.spec.ts,\
  src/**/*.spec.tsx,\
  src/**/__tests__/**

sonar.coverage.exclusions=\
  src/main.tsx,\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/**/*.spec.ts,\
  src/**/*.spec.tsx,\
  src/**/__tests__/**
