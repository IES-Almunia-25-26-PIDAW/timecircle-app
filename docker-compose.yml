services:
  db:
    image: postgres:alpine
    container_name: timecircle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timecircle_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timecircle_redis
    restart: unless-stopped
    networks:
      - timecircle_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timecircle_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_files:/app/static
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - timecircle_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timecircle_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    depends_on:
      - backend
    networks:
      - timecircle_net

  nginx:
    image: nginx:alpine
    container_name: timecircle_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/static:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - timecircle_net

  adminer:
    image: adminer:latest
    container_name: timecircle_adminer
    environment:
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DEFAULT_DB_HOST: db
      ADMINER_DEFAULT_DB_NAME: ${DB_NAME}
      ADMINER_DEFAULT_DB_USER: ${DB_USER}
      ADMINER_DEFAULT_DB_PASSWORD: ${DB_PASSWORD}
      ADMINER_DESIGN: 'nette'
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - timecircle_net

volumes:
  postgres_data:
  static_files:

networks:
  timecircle_net:
    driver: bridge