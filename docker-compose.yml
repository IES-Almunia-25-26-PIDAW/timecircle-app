services:
  db:
    image: postgres:alpine
    container_name: timecircle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timecircle_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timecircle_redis
    restart: unless-stopped
    networks:
      - timecircle_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: timecircle_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - timecircle_net
    # Lightweight, no volumes required (captures SMTP traffic in memory)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timecircle_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_files:/app/static
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - timecircle_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timecircle_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    depends_on:
      - backend
    networks:
      - timecircle_net

  nginx:
    image: nginx:alpine
    container_name: timecircle_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/static:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - timecircle_net

  adminer:
    image: adminer:latest
    container_name: timecircle_adminer
    environment:
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DEFAULT_DB_HOST: db
      ADMINER_DEFAULT_DB_NAME: ${DB_NAME}
      ADMINER_DEFAULT_DB_USER: ${DB_USER}
      ADMINER_DEFAULT_DB_PASSWORD: ${DB_PASSWORD}
      ADMINER_DESIGN: 'nette'
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - timecircle_net
  sonar_db:
    image: postgres:alpine
    container_name: timecircle_sonar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_postgres:/var/lib/postgresql/data
    networks:
      - timecircle_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: timecircle_sonarqube
    restart: unless-stopped
    depends_on:
      sonar_db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar_db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - timecircle_net

volumes:
  sonar_postgres:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:
  static_files:

networks:
  timecircle_net:
    driver: bridge