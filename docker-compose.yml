services:
  db:
    image: postgres:alpine
    container_name: timecircle_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - timecircle_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timecircle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - timecircle_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timecircle_backend
    restart: unless-stopped
    command: sh -c "python manage.py makemigrations api && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
    networks:
      - timecircle_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timecircle_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - timecircle_net

  nginx:
    image: nginx:alpine
    container_name: timecircle_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - timecircle_net

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - timecircle_net

volumes:
  postgres_data:

networks:
  timecircle_net:
    driver: bridge
