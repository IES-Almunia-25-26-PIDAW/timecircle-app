[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
pythonpath = backend
python_files = tests.py test_*.py *_tests.py
env_files = .env

addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --cov-config=.coveragerc

filterwarnings =
    ignore::DeprecationWarning:channels_redis
