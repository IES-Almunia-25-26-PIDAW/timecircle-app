sonar.projectKey=timecircle-backend
sonar.projectName=TimeCircle Backend
sonar.projectVersion=1.1
sonar.sourceEncoding=UTF-8

# Django / Python
sonar.python.version=3.12
sonar.sources=api,backend,manage.py
sonar.tests=api/tests
sonar.test.inclusions=api/tests/**/*.py,**/test_*.py,**/*_tests.py

# Coverage report generated from backend/ with pytest-cov.
sonar.python.coverage.reportPaths=coverage.xml

# Keep generated/runtime files out of the source analysis.
sonar.exclusions=\
  api/tests/**,\
  **/migrations/**,\
  **/__pycache__/**,\
  .pytest_cache/**,\
  static/**,\
  .venv/**,\
  venv/**

sonar.coverage.exclusions=\
  api/tests/**,\
  **/migrations/**,\
  backend/settings*.py,\
  manage.py,\
  api/management/commands/**,\
  api/routing.py,\
  api/asgi.py,\
  api/urls.py,\
  api/middleware.py,\