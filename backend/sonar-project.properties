# SonarQube properties for the backend (run scanner from the `backend/` folder)
sonar.projectKey=TimeCircle-Backend
sonar.projectName=TimeCircle Backend
sonar.projectVersion=1.0

# Source and tests
sonar.sources=.
sonar.tests=api/tests
sonar.test.inclusions=**/tests/**/*.py,**/api/**/tests/**/*.py
sonar.python.version=3.12.0

sonar.sourceEncoding=UTF-8

# Coverage produced by pytest with --cov and --cov-report=xml
# Example: pytest --junitxml=reports/junit.xml --cov=. --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# PyTest JUnit XML (optional)
sonar.junit.reportPaths=reports/junit.xml

# Exclude Django migrations, caches and virtualenvs
sonar.exclusions=**/migrations/**,**/__pycache__/**,venv/**,**/settings.py

# Files to omit from coverage metrics (keeps them analysed but excluded from coverage)
sonar.coverage.exclusions=api/management/**,api/routing.py,api/urls.py,api/middleware.py,backend/urls.py,**/migrations/**,**/tests/**,**/__init__.py,**/asgi.py,**/wsgi.py,**/settings.py,**/manage.py,seed_db.py
