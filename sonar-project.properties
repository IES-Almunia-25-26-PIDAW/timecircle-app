sonar.projectKey=timecircle
sonar.projectName=TimeCircle
sonar.projectVersion=1.0

# ─── BACKEND (Django) ───────────────────────────────────────
sonar.python.version=3.12

# Rutas donde están los tests
sonar.tests=backend
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/tests/**/*.py

# Cobertura (generada con pytest-cov)
sonar.python.coverage.reportPaths=backend/coverage.xml

# ─── FRONTEND (React) ────────────────────────────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ─── EXCLUSIONES ─────────────────────────────────────────────
sonar.exclusions=**/migrations/**,**/node_modules/**,**/venv/**,**/__pycache__/**
sonar.coverage.exclusions=**/migrations/**,**/settings*.py,**/manage.py